<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Console de lancement — SCHB Gica</title>
<style>
  :root{
    --bg:#f4f6fb;
    --bg-soft:#fbfcfe;
    --panel:#ffffff;
    --panel-2:#f1f5f9;
    --border:#dfe6f1;
    --border-strong:#cbd5e1;
    --text:#0f172a;
    --muted:#64748b;
    --accent:#7c3aed;
    --accent-2:#6d28d9;
    --green:#0f9d76;
    --amber:#b45309;
    --red:#dc2626;
    --radius:14px;
    --mono:"Cascadia Mono","Consolas","SFMono-Regular",ui-monospace,monospace;
    --sans:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:
      radial-gradient(1100px 520px at 12% -10%,rgba(124,58,237,.10),transparent 60%),
      radial-gradient(900px 460px at 92% 0%,rgba(15,157,118,.07),transparent 62%),
      var(--bg);
    color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit}
  a{color:inherit}

  /* ---------- Topbar ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    padding:14px 22px;border-bottom:1px solid var(--border);
    background:rgba(255,255,255,.9);backdrop-filter:blur(14px);
  }
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .mark{
    width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
    background:linear-gradient(140deg,#8b5cf6,#6d28d9);color:#fff;font-weight:800;letter-spacing:-.5px;
    box-shadow:0 8px 20px rgba(124,58,237,.28);font-size:13px;
  }
  .brand h1{margin:0;font-size:1.02rem;font-weight:750;letter-spacing:-.2px}
  .brand p{margin:0;font-size:.76rem;color:var(--muted)}
  .top-actions{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .conn{display:flex;align-items:center;gap:7px;font-size:.76rem;color:var(--muted);padding-right:6px}
  .conn i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(15,157,118,.16)}
  .conn.off i{background:var(--red);box-shadow:0 0 0 3px rgba(220,38,38,.16)}

  .btn{
    display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);
    background:#fff;color:var(--text);padding:8px 13px;border-radius:10px;
    font-size:.8rem;font-weight:650;cursor:pointer;transition:.15s;white-space:nowrap;
    box-shadow:0 1px 2px rgba(15,23,42,.04);
  }
  .btn:hover{background:var(--panel-2);border-color:var(--border-strong);transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
  .btn[hidden]{display:none!important}
  .btn.primary{background:linear-gradient(135deg,#8b5cf6,#7c3aed);border-color:transparent;color:#fff;box-shadow:0 6px 18px rgba(124,58,237,.28)}
  .btn.primary:hover{background:linear-gradient(135deg,#7c3aed,#6d28d9)}
  .btn.green{background:#ecfdf5;border-color:#a7f3d0;color:#047857}
  .btn.green:hover{background:#d1fae5}
  .btn.red{background:#fef2f2;border-color:#fecaca;color:#b91c1c}
  .btn.red:hover{background:#fee2e2}
  .btn.amber{background:#fffbeb;border-color:#fde68a;color:#b45309}
  .btn.amber:hover{background:#fef3c7}
  .btn.sm{padding:5px 10px;font-size:.74rem;border-radius:8px}

  /* ---------- Layout ---------- */
  main{padding:16px 20px 22px;max-width:1560px;margin:0 auto}
  .section-title{
    display:flex;align-items:center;gap:10px;margin:0 0 12px;
    font-size:.72rem;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:750;
  }
  .section-title::after{content:"";flex:1;height:1px;background:var(--border)}

  .services{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;margin-bottom:16px}
  .card{
    position:relative;overflow:hidden;background:var(--panel);
    border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;
    box-shadow:0 4px 16px rgba(15,23,42,.05);
  }
  .card::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--accent);opacity:.7}
  .card[data-state="running"]::before{background:var(--green)}
  .card[data-state="error"]::before{background:var(--red)}
  .card[data-state="starting"]::before,.card[data-state="stopping"]::before{background:#d97706}
  .card[data-state="external"]::before{background:#0284c7}

  .card-head{display:flex;align-items:flex-start;gap:11px}
  .dot{width:10px;height:10px;border-radius:50%;background:#cbd5e1;margin-top:6px;flex:none}
  .card[data-state="running"] .dot{background:var(--green);box-shadow:0 0 0 4px rgba(15,157,118,.14)}
  .card[data-state="starting"] .dot,.card[data-state="stopping"] .dot{background:#d97706;animation:pulse 1.1s infinite}
  .card[data-state="error"] .dot{background:var(--red);box-shadow:0 0 0 4px rgba(220,38,38,.14)}
  .card[data-state="external"] .dot{background:#0284c7;box-shadow:0 0 0 4px rgba(2,132,199,.14)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .card-head h2{margin:0;font-size:.98rem;font-weight:720}
  .card-head p{margin:1px 0 0;font-size:.75rem;color:var(--muted)}
  .pill{
    margin-left:auto;font-size:.7rem;font-weight:750;padding:4px 10px;border-radius:999px;
    background:#f1f5f9;border:1px solid var(--border);color:var(--muted);white-space:nowrap;
  }
  .card[data-state="running"] .pill{background:#ecfdf5;border-color:#a7f3d0;color:#047857}
  .card[data-state="starting"] .pill,.card[data-state="stopping"] .pill{background:#fffbeb;border-color:#fde68a;color:#b45309}
  .card[data-state="error"] .pill{background:#fef2f2;border-color:#fecaca;color:#b91c1c}
  .card[data-state="external"] .pill{background:#eff6ff;border-color:#bfdbfe;color:#1d4ed8}

  .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:11px 0 8px}
  .metrics div{background:#f8fafc;border:1px solid var(--border);border-radius:9px;padding:7px 9px}
  .metrics dt{font-size:.63rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
  .metrics dd{margin:2px 0 0;font-family:var(--mono);font-size:.84rem;font-weight:600;color:#1e293b}
  .card .msg{min-height:19px;font-size:.76rem;color:var(--muted);margin-bottom:11px;word-break:break-word}
  .card .msg.err{color:#b91c1c}
  .card .msg.ok{color:#047857}
  .card-actions{display:flex;gap:7px;flex-wrap:wrap}
  .card-actions .btn{flex:0 0 auto}

  /* ---------- Panels ---------- */
  .grid{display:grid;grid-template-columns:minmax(320px,400px) minmax(0,1fr);gap:14px;align-items:start}
  @media (max-width:1060px){.grid{grid-template-columns:1fr}}

  .panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 4px 16px rgba(15,23,42,.05)}
  .panel-head{display:flex;align-items:center;gap:9px;padding:13px 15px;border-bottom:1px solid var(--border)}
  .panel-head h2{margin:0;font-size:.88rem;font-weight:720}
  .panel-head .spacer{margin-left:auto;display:flex;gap:7px;align-items:center}
  .panel-body{padding:13px 15px}

  .check{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px dashed #e8eef7}
  .check:last-child{border-bottom:none;padding-bottom:0}
  .check .ico{
    width:22px;height:22px;border-radius:7px;flex:none;display:grid;place-items:center;
    font-size:.7rem;font-weight:800;background:#f1f5f9;color:var(--muted);
  }
  .check.ok .ico{background:#ecfdf5;color:#047857}
  .check.warn .ico{background:#fffbeb;color:#b45309}
  .check.bad .ico{background:#fef2f2;color:#b91c1c}
  .check .label{font-size:.79rem;font-weight:650;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .check .sub{font-size:.73rem;color:var(--muted);word-break:break-word}
  .check .sub code{font-family:var(--mono);background:#f1f5f9;border:1px solid var(--border);padding:1px 5px;border-radius:5px;font-size:.72rem;color:#334155}
  .check-actions{margin-left:auto;flex:none}

  /* ---------- Console ---------- */
  .tabs{display:flex;gap:5px;padding:9px 12px 0;flex-wrap:wrap}
  .tab{
    border:1px solid transparent;border-bottom:none;background:transparent;color:var(--muted);
    padding:7px 13px;border-radius:9px 9px 0 0;font-size:.78rem;font-weight:650;cursor:pointer;
    display:flex;align-items:center;gap:7px;
  }
  .tab:hover{color:var(--text);background:#f8fafc}
  .tab.active{color:var(--text);background:#f8fafc;border-color:var(--border)}
  .tab .badge{font-size:.64rem;background:#eef2f7;border-radius:999px;padding:1px 7px;color:var(--muted);font-family:var(--mono)}
  .tab.active .badge{background:#ede9fe;color:#6d28d9}

  .console-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 13px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:#f8fafc}
  .toggle{display:flex;align-items:center;gap:6px;font-size:.74rem;color:var(--muted);cursor:pointer;user-select:none}
  .toggle input{accent-color:var(--accent);cursor:pointer}
  .console-toolbar .spacer{margin-left:auto;display:flex;gap:6px;align-items:center}

  .console{
    height:clamp(220px,30vh,440px);overflow:auto;background:#fbfcfe;
    font-family:var(--mono);font-size:12.4px;line-height:1.55;padding:10px 13px;
    border-radius:0 0 var(--radius) var(--radius);
    scrollbar-width:thin;scrollbar-color:#cbd5e1 transparent;
  }
  .console::-webkit-scrollbar{width:10px;height:10px}
  .console::-webkit-scrollbar-thumb{background:#d5deea;border-radius:8px}
  .ln{display:flex;gap:10px;white-space:pre-wrap;word-break:break-word;padding:1px 0}
  .ln time{color:#94a3b8;flex:none;font-size:11.5px;padding-top:1px}
  .ln span{flex:1;min-width:0;color:#1e293b}
  .ln.stderr span{color:#b91c1c}
  .ln.system span{color:#6d28d9}
  .ln.error span{color:#b91c1c}
  .ln.warn span{color:#b45309}
  .ln.ok span{color:#047857}
  .console-empty{padding:30px 10px;text-align:center;color:#94a3b8;font-size:12.5px;font-family:var(--sans)}

  .opbar{padding:10px 13px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;font-size:.76rem;color:var(--muted);flex-wrap:wrap}
  .opbar .progress{flex:1;height:5px;border-radius:99px;background:#eef2f7;overflow:hidden;min-width:80px}
  .opbar .progress i{display:block;height:100%;width:38%;background:linear-gradient(90deg,#7c3aed,#a78bfa);animation:slide 1.15s infinite ease-in-out}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}

  /* ---------- Toast ---------- */
  #toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:9px;z-index:60;max-width:380px}
  .toast{
    background:#fff;border:1px solid var(--border);border-left:3px solid var(--accent);
    padding:11px 14px;border-radius:10px;font-size:.8rem;box-shadow:0 14px 34px rgba(15,23,42,.14);
    animation:in .18s ease-out;
  }
  .toast.ok{border-left-color:var(--green)}
  .toast.err{border-left-color:var(--red)}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="mark">GICA</div>
    <div>
      <h1>Console de lancement — Portail RH</h1>
      <p>SCHB Gica · démarrage et supervision des services</p>
    </div>
  </div>
  <div class="top-actions">
    <div class="conn" id="conn"><i></i><span>connectée</span></div>
    <button class="btn green" id="btn-start-all">▶ Tout démarrer</button>
    <button class="btn amber" id="btn-restart-all">↻ Tout redémarrer</button>
    <button class="btn red" id="btn-stop-all">■ Tout arrêter</button>
    <button class="btn primary" id="btn-open-app">Ouvrir l'application</button>
  </div>
</header>

<main>
  <div class="section-title">Services</div>
  <section class="services" id="services"></section>

  <div class="grid">
    <section class="panel">
      <div class="panel-head">
        <h2>Contrôles système</h2>
        <div class="spacer"><button class="btn sm" id="btn-refresh">Actualiser</button></div>
      </div>
      <div class="panel-body" id="checks">
        <div class="check"><div class="ico">…</div><div><div class="label">Analyse…</div></div></div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Console des opérations</h2>
        <div class="spacer">
          <span class="badge" id="ops-status" style="font-size:.72rem;color:var(--muted)"></span>
        </div>
      </div>

      <div class="tabs" id="tabs">
        <button class="tab active" data-tab="backend">Serveur API <span class="badge" data-count="backend">0</span></button>
        <button class="tab" data-tab="frontend">Interface Web <span class="badge" data-count="frontend">0</span></button>
        <button class="tab" data-tab="ops">Opérations <span class="badge" data-count="ops">0</span></button>
      </div>

      <div class="console-toolbar">
        <label class="toggle"><input type="checkbox" id="autoscroll" checked> Défilement auto</label>
        <label class="toggle"><input type="checkbox" id="wrap" checked> Retour à la ligne</label>
        <div class="spacer">
          <button class="btn sm" id="btn-copy">Copier</button>
          <button class="btn sm" id="btn-clear">Vider</button>
        </div>
      </div>

      <div class="console" id="console">
        <div class="console-empty">Aucune sortie pour le moment. Démarrez un service pour voir ses logs.</div>
      </div>

      <div class="opbar">
        <span id="op-label">Aucune opération en cours</span>
        <div class="progress" id="op-progress" hidden><i></i></div>
        <span class="spacer" style="margin-left:auto"></span>
        <button class="btn sm" id="btn-build">Reconstruire (production)</button>
        <button class="btn sm" id="btn-install">npm install</button>
      </div>
    </section>
  </div>
</main>

<div id="toasts"></div>

<script>
'use strict';

const state = {
  data: null,
  system: null,
  activeTab: 'backend',
  lastSeq: { backend: 0, frontend: 0, ops: 0 }
};

const CONSOLE = document.getElementById('console');
const toastBox = document.getElementById('toasts');

/* ---------------- helpers ---------------- */
async function call(path, body) {
  const res = await fetch(path, {
    method: body === undefined ? 'GET' : 'POST',
    headers: body === undefined ? {} : { 'Content-Type': 'application/json' },
    body: body === undefined ? undefined : JSON.stringify(body)
  });
  let data = {};
  try { data = await res.json(); } catch { /* réponse non JSON */ }
  if (!res.ok) throw new Error(data.message || `Erreur ${res.status}`);
  return data;
}

function toast(message, type = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = message;
  toastBox.appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity .25s, transform .25s';
    el.style.opacity = '0';
    el.style.transform = 'translateY(6px)';
    setTimeout(() => el.remove(), 260);
  }, 4200);
}

const pad = (n) => String(n).padStart(2, '0');
function clock(ts) {
  const d = new Date(ts);
  return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
function duration(ms) {
  if (!ms || ms < 0) return '—';
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return h > 0 ? `${h} h ${pad(m)} min` : m > 0 ? `${m} min ${pad(sec)} s` : `${sec} s`;
}
function fileTime(ms) {
  if (!ms) return '—';
  const d = new Date(ms);
  return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

const STATUS_LABEL = {
  stopped: 'Arrêté', starting: 'Démarrage…', running: 'En cours',
  external: 'Externe', stopping: 'Arrêt…', error: 'Erreur'
};

/* ---------------- service cards ---------------- */
function renderServices() {
  if (!state.data) return;
  const container = document.getElementById('services');
  for (const svc of Object.values(state.data.services)) {
    let card = container.querySelector(`[data-key="${svc.key}"]`);
    if (!card) {
      card = document.createElement('article');
      card.className = 'card';
      card.dataset.key = svc.key;
      card.innerHTML = `
        <div class="card-head">
          <span class="dot"></span>
          <div><h2></h2><p></p></div>
          <span class="pill"></span>
        </div>
        <dl class="metrics">
          <div><dt>Port</dt><dd data-f="port"></dd></div>
          <div><dt>PID</dt><dd data-f="pid"></dd></div>
          <div><dt>Uptime</dt><dd data-f="uptime"></dd></div>
        </dl>
        <div class="msg"></div>
        <div class="card-actions">
          <button class="btn green sm" data-act="start">▶ Démarrer</button>
          <button class="btn red sm" data-act="stop">■ Arrêter</button>
          <button class="btn amber sm" data-act="takeover" hidden>■ Arrêter l'instance externe</button>
          <button class="btn sm" data-act="restart">↻ Redémarrer</button>
          <button class="btn sm" data-act="logs">Logs</button>
          <a class="btn sm" data-f="open" target="_blank" rel="noopener" hidden>Ouvrir ↗</a>
        </div>`;
      card.querySelector('[data-act="start"]').onclick = () => action(svc.key, 'start');
      card.querySelector('[data-act="stop"]').onclick = () => action(svc.key, 'stop');
      card.querySelector('[data-act="restart"]').onclick = () => action(svc.key, 'restart');
      card.querySelector('[data-act="takeover"]').onclick = () => {
        if (!window.confirm(`${svc.label} tourne déjà en dehors de la console.\nArrêter cette instance pour libérer le port ${svc.port} ?`)) return;
        action(svc.key, 'stop');
      };
      card.querySelector('[data-act="logs"]').onclick = () => switchTab(svc.key);
      container.appendChild(card);
    }

    card.dataset.state = svc.status;
    card.querySelector('h2').textContent = svc.label;
    card.querySelector('p').textContent = svc.subtitle;
    card.querySelector('.pill').textContent = STATUS_LABEL[svc.status] || svc.status;
    card.querySelector('[data-f="port"]').textContent = svc.port;
    card.querySelector('[data-f="pid"]').textContent = svc.pid ? svc.pid : '—';
    card.querySelector('[data-f="uptime"]').dataset.since = svc.startedAt || '';
    card.querySelector('[data-f="uptime"]').textContent = svc.startedAt && (svc.status === 'running' || svc.status === 'starting')
      ? duration(Date.now() - svc.startedAt) : '—';

    const msg = card.querySelector('.msg');
    msg.textContent = svc.message || '';
    msg.className = 'msg' + (svc.status === 'error' ? ' err' : svc.status === 'running' ? ' ok' : '');

    const openLink = card.querySelector('[data-f="open"]');
    const canOpen = svc.openUrl && (svc.status === 'running' || svc.status === 'external');
    openLink.hidden = !canOpen;
    if (canOpen) openLink.href = svc.openUrl;

    const busy = svc.status === 'starting' || svc.status === 'stopping';
    const external = svc.status === 'external';
    card.querySelector('[data-act="start"]').disabled = busy || svc.status === 'running' || external;
    card.querySelector('[data-act="stop"]').disabled = busy || !(svc.status === 'running' || svc.status === 'starting');
    card.querySelector('[data-act="takeover"]').hidden = !external;
    card.querySelector('[data-act="restart"]').disabled = busy || external;
  }
  updateCounts();
  updateOpsBar();
}

function updateCounts() {
  if (!state.data) return;
  for (const [key, svc] of Object.entries(state.data.services)) {
    const badge = document.querySelector(`[data-count="${key}"]`);
    if (badge) badge.textContent = svc.logCount;
  }
  const opsBadge = document.querySelector('[data-count="ops"]');
  if (opsBadge) opsBadge.textContent = state.data.ops.logCount;
}

function updateOpsBar() {
  const ops = state.data?.ops;
  const label = document.getElementById('op-label');
  const prog = document.getElementById('op-progress');
  if (!ops) return;
  if (ops.running) {
    label.textContent = `${ops.label} en cours… (${duration(Date.now() - ops.startedAt)})`;
    prog.hidden = false;
  } else {
    prog.hidden = true;
    if (ops.finishedAt) {
      const ok = ops.exitCode === 0;
      label.textContent = `${ops.label} — ${ok ? 'terminé avec succès' : `échec (code ${ops.exitCode})`} · ${clock(ops.finishedAt)}`;
      label.style.color = ok ? '#6ee7b7' : '#fca5a5';
    } else {
      label.textContent = 'Aucune opération en cours';
      label.style.color = '';
    }
  }
  document.getElementById('btn-build').disabled = !!ops.running;
  document.getElementById('btn-install').disabled = !!ops.running;
}

/* ---------------- system checks ---------------- */
function renderChecks() {
  const s = state.system;
  if (!s) return;
  const box = document.getElementById('checks');
  const rows = [];

  rows.push(checkRow(
    s.node ? 'ok' : 'bad',
    'Node.js',
    `${s.node} · npm ${s.npm || 'introuvable'}`,
    ''
  ));

  rows.push(checkRow(
    s.modulesInstalled ? 'ok' : 'bad',
    'Dépendances',
    s.modulesInstalled ? 'node_modules présent' : 'node_modules absent — lancez npm install',
    s.modulesInstalled ? '' : '<button class="btn sm" data-cmd="install">Installer</button>'
  ));

  const envSub = !s.envExists
    ? 'Fichier .env introuvable — copiez .env.example'
    : s.missingEnv.length
      ? `Variables manquantes : ${s.missingEnv.map((k) => `<code>${k}</code>`).join(', ')}`
      : `Base <code>${s.database.name}</code> · ${s.database.host}:${s.database.port}`;
  rows.push(checkRow(
    !s.envExists || s.missingEnv.length ? 'bad' : 'ok',
    'Configuration (.env)',
    envSub,
    ''
  ));

  rows.push(checkRow(
    s.smtpConfigured ? 'ok' : 'warn',
    'Messagerie SMTP',
    s.smtpConfigured ? 'Identifiants renseignés (envoi actif)' : 'Non configurée — les emails de validation seront désactivés',
    ''
  ));

  rows.push(checkRow(
    s.seedDemo ? 'warn' : 'ok',
    'Mode démonstration',
    s.seedDemo ? 'SEED_DEMO=true : les comptes de démo peuvent être recréés' : 'Désactivé (installation réelle)',
    ''
  ));

  const portConflict = Object.entries(s.ports || {}).filter(([key, busy]) => {
    const svc = state.data?.services?.[key];
    return busy && (!svc || (svc.status === 'stopped' || svc.status === 'error'));
  });
  const busyByServices = Object.entries(s.ports || {})
    .filter(([key, busy]) => busy && !portConflict.some(([k]) => k === key))
    .map(([k]) => `${state.data?.services?.[k]?.port || k}`);
  rows.push(checkRow(
    portConflict.length ? 'bad' : 'ok',
    'Ports',
    portConflict.length
      ? `Occupés hors console : ${portConflict.map(([k]) => `${state.data?.services?.[k]?.label || k} (${state.data?.services?.[k]?.port || '?'})`).join(', ')}`
      : busyByServices.length
        ? `${busyByServices.join(' et ')} utilisés par les services de la console`
        : `8081 et 8082 disponibles`,
    ''
  ));

  rows.push(checkRow(
    s.dist ? 'ok' : 'warn',
    'Build de production',
    s.dist ? `dist généré le ${fileTime(s.dist.modifiedAt)}` : 'Aucun build — « Reconstruire » pour générer dist/',
    '<button class="btn sm" data-cmd="build">Reconstruire</button>'
  ));

  rows.push(`
    <div class="check" id="db-check">
      <div class="ico">DB</div>
      <div style="flex:1">
        <div class="label">Connexion MySQL</div>
        <div class="sub" id="db-result">${s.database.host}:${s.database.port} / ${s.database.name}</div>
      </div>
      <div class="check-actions"><button class="btn sm" data-cmd="db">Tester</button></div>
    </div>`);

  box.innerHTML = rows.join('');

  box.querySelector('[data-cmd="install"]')?.addEventListener('click', () => runOp('install'));
  box.querySelectorAll('[data-cmd="build"]').forEach((b) => b.addEventListener('click', () => runOp('build')));
  box.querySelector('[data-cmd="db"]')?.addEventListener('click', testDatabase);
}

function checkRow(kind, label, sub, actionHtml) {
  const symbol = kind === 'ok' ? '✓' : kind === 'warn' ? '!' : '✕';
  return `
    <div class="check ${kind}">
      <div class="ico">${symbol}</div>
      <div style="flex:1">
        <div class="label">${label}</div>
        <div class="sub">${sub}</div>
      </div>
      ${actionHtml ? `<div class="check-actions">${actionHtml}</div>` : ''}
    </div>`;
}

async function testDatabase() {
  const res = document.getElementById('db-result');
  if (res) { res.textContent = 'Connexion en cours…'; res.style.color = ''; }
  try {
    const data = await call('/api/system/db-check', {});
    const r = data.result;
    if (!res) return;
    if (r.ok) {
      res.innerHTML = `Connectée en ${r.latency} ms · MySQL ${r.server || ''}<br>` +
        `<code>${r.employees ?? '?'}</code> employés · <code>${r.pointages ?? '?'}</code> pointages`;
      res.style.color = '#6ee7b7';
      toast('Base MySQL accessible.', 'ok');
    } else {
      res.textContent = r.message;
      res.style.color = '#fca5a5';
      toast(r.message, 'err');
    }
  } catch (err) {
    if (res) { res.textContent = err.message; res.style.color = '#fca5a5'; }
    toast(err.message, 'err');
  }
}

/* ---------------- console ---------------- */
function lineClass(stream, text) {
  if (stream === 'stderr') return 'stderr';
  if (stream === 'system') return 'system';
  if (/\b(error|erreur|failed|échec|exception)\b/i.test(text)) return 'error';
  if (/\b(warn|warning|avertissement)\b/i.test(text)) return 'warn';
  if (/\b(prêt|ready|success|connecté|en cours d'exécution)\b/i.test(text)) return 'ok';
  return '';
}

function appendLine(key, line) {
  if (key !== state.activeTab) return;
  const empty = CONSOLE.querySelector('.console-empty');
  if (empty) empty.remove();

  const el = document.createElement('div');
  el.className = 'ln ' + lineClass(line.stream, line.text);
  const time = document.createElement('time');
  time.textContent = clock(line.t);
  const span = document.createElement('span');
  span.textContent = line.text;
  el.append(time, span);

  const nearBottom = CONSOLE.scrollTop + CONSOLE.clientHeight >= CONSOLE.scrollHeight - 60;
  CONSOLE.appendChild(el);
  while (CONSOLE.childElementCount > 2500) CONSOLE.firstElementChild.remove();

  if (document.getElementById('autoscroll').checked && nearBottom) {
    CONSOLE.scrollTop = CONSOLE.scrollHeight;
  }
}

async function loadTab(key) {
  CONSOLE.innerHTML = '';
  state.lastSeq[key] = 0;
  try {
    const data = await call(`/api/logs/${key}?since=0`);
    if (key !== state.activeTab) return;
    if (!data.lines.length) {
      CONSOLE.innerHTML = `<div class="console-empty">${key === 'ops'
        ? 'Aucune opération lancée. Utilisez « Reconstruire » ou « npm install ».'
        : 'Aucune sortie pour le moment. Démarrez le service pour voir ses logs.'}</div>`;
      return;
    }
    for (const line of data.lines) {
      appendLine(key, line);
      state.lastSeq[key] = Math.max(state.lastSeq[key], line.seq);
    }
    CONSOLE.scrollTop = CONSOLE.scrollHeight;
  } catch (err) {
    CONSOLE.innerHTML = `<div class="console-empty">${err.message}</div>`;
  }
}

function switchTab(key) {
  state.activeTab = key;
  document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t.dataset.tab === key));
  loadTab(key);
}

document.querySelectorAll('.tab').forEach((tab) => {
  tab.addEventListener('click', () => switchTab(tab.dataset.tab));
});

document.getElementById('btn-clear').addEventListener('click', async () => {
  const key = state.activeTab;
  try {
    await call(`/api/logs/${key}/clear`, {});
    state.lastSeq[key] = 0;
    CONSOLE.innerHTML = '<div class="console-empty">Console vidée.</div>';
    refresh();
  } catch (err) { toast(err.message, 'err'); }
});

document.getElementById('btn-copy').addEventListener('click', async () => {
  const text = [...CONSOLE.querySelectorAll('.ln')].map((el) => el.innerText).join('\n');
  if (!text) return toast('Rien à copier.');
  try {
    await navigator.clipboard.writeText(text);
    toast('Logs copiés dans le presse-papiers.', 'ok');
  } catch {
    toast('Copie impossible depuis ce navigateur.', 'err');
  }
});

document.getElementById('wrap').addEventListener('change', (e) => {
  CONSOLE.style.whiteSpace = e.target.checked ? '' : 'nowrap';
});

/* ---------------- actions ---------------- */
async function action(key, act) {
  try {
    const data = await call(`/api/services/${key}/${act}`, {});
    if (data.message) toast(data.message, data.ok === false ? '' : 'ok');
  } catch (err) {
    toast(err.message, 'err');
  }
  refresh();
}

async function all(act) {
  try {
    const data = await call(`/api/all/${act}`, {});
    toast(data.message || 'Opération effectuée.', 'ok');
  } catch (err) {
    toast(err.message, 'err');
  }
  refresh();
}

async function runOp(kind) {
  try {
    const data = await call(`/api/operation/${kind}`, {});
    toast(data.message || 'Opération lancée.');
    switchTab('ops');
  } catch (err) {
    toast(err.message, 'err');
  }
  refresh();
}

document.getElementById('btn-start-all').addEventListener('click', () => all('start'));
document.getElementById('btn-stop-all').addEventListener('click', () => all('stop'));
document.getElementById('btn-restart-all').addEventListener('click', () => all('restart'));
document.getElementById('btn-refresh').addEventListener('click', () => refresh(true));
document.getElementById('btn-build').addEventListener('click', () => runOp('build'));
document.getElementById('btn-install').addEventListener('click', () => runOp('install'));
document.getElementById('btn-open-app').addEventListener('click', async () => {
  try {
    const data = await call('/api/open', { url: 'app' });
    toast(`Ouverture de ${data.url}`);
  } catch (err) { toast(err.message, 'err'); }
});

/* ---------------- state sync ---------------- */
async function refresh(showToast = false) {
  try {
    const data = await call('/api/state');
    state.data = data.state;
    state.system = data.system;
    renderServices();
    renderChecks();
    if (showToast) toast('État actualisé.', 'ok');
  } catch (err) {
    if (showToast) toast(err.message, 'err');
  }
}

function connectStream() {
  const conn = document.getElementById('conn');
  const es = new EventSource('/api/stream');

  es.onopen = () => {
    conn.classList.remove('off');
    conn.lastElementChild.textContent = 'connectée';
  };
  es.onerror = () => {
    conn.classList.add('off');
    conn.lastElementChild.textContent = 'reconnexion…';
  };
  es.onmessage = (event) => {
    let payload;
    try { payload = JSON.parse(event.data); } catch { return; }
    if (payload.type === 'log') {
      const { store, line } = payload;
      if (state.activeTab === store) {
        if (line.seq > state.lastSeq[store]) {
          appendLine(store, line);
          state.lastSeq[store] = line.seq;
        }
      }
      updateCounts();
    } else if (payload.type === 'state') {
      const prev = state.data;
      state.data = payload.state;
      if (!prev) { renderServices(); return; }
      renderServices();
      const statusChanged = Object.keys(payload.state.services).some(
        (k) => prev.services[k]?.status !== payload.state.services[k].status
      );
      if (statusChanged) refresh();
    }
  };
}

/* uptime + op timer */
setInterval(() => {
  document.querySelectorAll('[data-f="uptime"]').forEach((el) => {
    const since = Number(el.dataset.since || 0);
    el.textContent = since ? duration(Date.now() - since) : '—';
  });
  if (state.data?.ops?.running) updateOpsBar();
}, 1000);

/* initial */
refresh();
connectStream();
switchTab('backend');
</script>
</body>
